<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Meeting Viewer</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="lib/katex.min.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body class="mdv">
  <main class="mdv-drop">
    <div class="mdv-drop-box">
      <p class="mdv-drop-title">Drop a Markdown file here</p>
      <p class="mdv-drop-sub">or</p>
      <label class="mdv-pick">
        Choose file
        <input type="file" id="picker" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
      </label>
    </div>
  </main>

  <script src="lib/marked.min.js"></script>
  <script src="lib/marked-footnote.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/katex.min.js"></script>
  <script src="settings.js"></script>
  <script src="research.js"></script>
  <script src="timer.js"></script>
  <script src="present.js"></script>
  <script src="render.js"></script>
  <script src="page.js"></script>
</body>
</html>
